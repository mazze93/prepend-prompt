name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build, audit
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a full commit SHA, never a mutable
      # tag — a tag can be repointed at arbitrary code after review.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      # `ci`, not `install`: installs exactly the lockfile and fails if
      # package.json and the lockfile disagree. `npm install` would silently
      # resolve a different tree than the one that was reviewed.
      - name: Install (locked)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # This repo ships BOTH ways, so both are built:
      #   `npm run build` (tsc) produces dist/stdio.js, the stdio MCP entry.
      #   the wrangler dry-run covers the Worker entry.
      # Building only one would leave the other able to break unnoticed.
      - name: Build (stdio entry)
        run: npm run build

      # --dry-run builds and exits without touching the account, so this needs
      # no Cloudflare credentials and can never publish from CI.
      - name: Build (worker entry — wrangler dry-run, never deploys)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/build"

      # Gate PRODUCTION dependencies at zero. The tree is at zero across both
      # production and dev as of the preceding commit, so the gate starts
      # honest rather than grandfathering a backlog. --omit=dev keeps a future
      # devDependency advisory with no non-breaking fix from wedging CI; dev
      # findings are still printed below, just not fatal.
      - name: Audit production dependencies (must be zero)
        run: npm audit --omit=dev --audit-level=low

      - name: Audit dev dependencies (report only)
        run: npm audit || true
